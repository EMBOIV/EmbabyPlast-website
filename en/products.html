<!DOCTYPE html>
<html lang="en-US" dir="ltr" translate="no">
<head>
    <meta charset="utf-8">
    <meta name="google" content="notranslate">
    <meta http-equiv="X-UA-Compatible" content="IE-edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#0B1D2A">
    <meta name="description" content="Browse our complete range of plastic combs - hair styling, barber professional, pocket, anti-static, wide tooth, tail combs and custom molded combs.">
    <meta name="keywords" content="plastic combs catalog, wholesale combs, barber combs, hair styling combs, custom plastic combs, Embaby Plast">

    <title>Product Catalog - Embaby Plast</title>
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="preload" href="../style.css" as="style">
    <link rel="preload" href="../script.js" as="script">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
    <link rel="stylesheet" href="../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">

    <script src="../script.js" defer></script>
</head>
<body>

<header id="site-header"></header>

<!-- products start -->
<section class="products luxury-grid" id="products">
    <h1 class="heading">Product <span>Catalog</span></h1>
    <div class="products-section-toggle" id="products-section-toggle" aria-label="Catalog section toggle">
        <button type="button" class="products-section-btn active" data-product-section="products" aria-pressed="true">Best Selling Products</button>
        <button type="button" class="products-section-btn" data-product-section="premium" aria-pressed="false">High Quality Products</button>
    </div>
    <div class="products-search">
        <div class="products-search-input-wrap">
            <i class="fas fa-search products-search-icon"></i>
            <input type="text" id="product-search" class="products-search-input" placeholder="Search by product name or description..." autocomplete="off">
        </div>
        <span class="products-view-toggle" id="products-view-toggle" aria-label="Catalog view toggle">
            <button type="button" class="products-view-btn" data-group-mode="family" aria-pressed="true" title="Group families view">
                <i class="fas fa-layer-group" aria-hidden="true"></i>
            </button>
            <button type="button" class="products-view-btn" data-group-mode="variant" aria-pressed="false" title="Show all variants view">
                <i class="fas fa-list" aria-hidden="true"></i>
            </button>
        </span>
    </div>
    <p class="products-total-count" id="products-total-count"><span class="products-total-count-text" id="products-total-count-text"></span></p>
    <p class="products-no-results" id="no-results">No products match your search.</p>
    <div class="box-container">
    </div>
</section>
<!-- products end -->

<footer class="footer" id="site-footer"></footer>

</body>
</html>
